<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Windows 98 Portfolio</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Tahoma, sans-serif;
}

body{
    overflow:hidden;
    background:#008080;
    height:100vh;
}

/* DESKTOP */

.desktop{
    width:100%;
    height:100vh;
    position:relative;

    background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

    background-size:4px 4px;
}

/* WINDOWS */

.window{
    position:absolute;
    width:320px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    box-shadow:4px 4px 0 rgba(0,0,0,0.3);

    z-index:1;
}

.title-bar{
    background:linear-gradient(to right, navy, #1084d0);

    color:white;

    padding:5px 8px;

    font-weight:bold;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:move;
    user-select:none;
}

.close-btn{
    width:18px;
    height:18px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    color:black;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:12px;
    cursor:pointer;
}

.window-content{
    padding:14px;
    color:black;
    line-height:1.5;
}

h2{
    margin-bottom:10px;
    font-size:18px;
}

ul{
    margin-left:20px;
}

p{
    margin-bottom:10px;
}

.image-frame{
    width:100%;
    display:block;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
}

/* DOWNLOAD BUTTON */

.download-btn{
    display:inline-block;

    margin-top:12px;
    padding:6px 10px;

    background:#c0c0c0;
    color:black;

    text-decoration:none;
    font-weight:bold;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;
}

.download-btn:active{
    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
}

/* TASKBAR */

.taskbar{
    position:absolute;
    bottom:0;
    width:100%;
    height:42px;

    background:#c0c0c0;
    border-top:2px solid #fff;

    display:flex;
    align-items:center;

    padding:4px;

    z-index:999;
}

.start-btn{
    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    padding:6px 12px;

    font-weight:bold;
    cursor:pointer;
}

/* CENTER NAME */

.taskbar-name{
    position:absolute;
    left:50%;
    transform:translateX(-50%);

    font-weight:bold;
    color:black;

    letter-spacing:1px;
}

/* START MENU */

.start-menu{
    position:absolute;
    bottom:45px;
    left:4px;

    width:240px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    display:none;

    max-height:500px;
    overflow:auto;

    z-index:9999;
}

.menu-item{
    padding:10px;

    cursor:pointer;

    border-bottom:1px solid #888;

    display:flex;
    align-items:center;
    gap:10px;
}

.menu-item:hover{
    background:navy;
    color:white;
}

.menu-icon{
    width:24px;
    height:24px;

    background:white;

    border:1px solid black;

    object-fit:cover;
}

.clock{
    margin-left:auto;

    background:#bdbdbd;

    padding:5px 10px;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;

    min-width:90px;
    text-align:center;
}

</style>
</head>

<body>

<div class="desktop" id="desktop">

    <!-- START MENU -->

    <div class="start-menu" id="startMenu">

        <div class="menu-item" onclick="openCVWindow()">
            <div class="menu-icon"></div>
            <span>CV.txt</span>
        </div>

        <div class="menu-item" onclick="openSkillsWindow()">
            <div class="menu-icon"></div>
            <span>Skills.exe</span>
        </div>

        <div class="menu-item" onclick="openBioWindow()">
            <div class="menu-icon"></div>
            <span>Bio.doc</span>
        </div>

        <div class="menu-item" onclick="openArtistWindow()">

            <img src="artiststatement.png" class="menu-icon">

            <span>ArtistStatement.png</span>

        </div>

        <div class="menu-item" onclick="openImageWindow('image1.jpg','Artwork1.bmp')">

            <img src="image1.jpg" class="menu-icon">

            <span>Artwork 1</span>

        </div>

        <div class="menu-item" onclick="openImageWindow('image2.jpg','Artwork2.bmp')">

            <img src="image2.jpg" class="menu-icon">

            <span>Artwork 2</span>

        </div>

        <div class="menu-item" onclick="openImageWindow('image3.jpg','Artwork3.bmp')">

            <img src="image3.jpg" class="menu-icon">

            <span>Artwork 3</span>

        </div>

    </div>

    <!-- TASKBAR -->

    <div class="taskbar">

        <button class="start-btn" id="startButton">
            Menu
        </button>

        <div class="taskbar-name">
            Jett Tarwater
        </div>

        <div class="clock" id="clock">
            12:00 PM
        </div>

    </div>

</div>

<script>

const desktop = document.getElementById("desktop");
const startButton = document.getElementById("startButton");
const startMenu = document.getElementById("startMenu");

/* START MENU */

startButton.addEventListener("click", () => {

    if(startMenu.style.display === "block"){

        startMenu.style.display = "none";

    }else{

        startMenu.style.display = "block";

    }

});

/* WINDOW CREATOR */

function createWindow(title, content, top = 100, left = 100){

    const windowDiv = document.createElement("div");

    windowDiv.className = "window";

    windowDiv.style.top = top + "px";
    windowDiv.style.left = left + "px";

    windowDiv.innerHTML = `

        <div class="title-bar">

            <span>${title}</span>

            <div class="close-btn">✕</div>

        </div>

        <div class="window-content">

            ${content}

        </div>

    `;

    desktop.appendChild(windowDiv);

    makeDraggable(windowDiv);

    const closeBtn = windowDiv.querySelector(".close-btn");

    closeBtn.addEventListener("click", () => {

        windowDiv.remove();

    });

    startMenu.style.display = "none";

}

/* CV */

function openCVWindow(){

    createWindow("CV.txt", `

        <h2>Curriculum Vitae</h2>

        <p><strong>Name:</strong> Jett Tarwater</p>

        <p><strong>Email:</strong> you@email.com</p>

        <p><strong>Experience:</strong></p>

        <ul>
            <li>Frontend Developer</li>
            <li>UI / UX Designer</li>
            <li>Creative Technologist</li>
        </ul>

    `, 60, 60);

}

/* SKILLS */

function openSkillsWindow(){

    createWindow("Skills.exe", `

        <h2>Skills</h2>

        <ul>
            <li>HTML / CSS</li>
            <li>JavaScript</li>
            <li>Godot Engine</li>
            <li>Music Production</li>
            <li>3D Modeling</li>
            <li>Digital Fabrication</li>
        </ul>

    `, 120, 420);

}

/* BIO */

function openBioWindow(){

    createWindow("Bio.doc", `

        <h2>Bio</h2>

        <p>
            Creative developer focused on interactive media,
            digital aesthetics, and experimental web experiences.
        </p>

        <p>
            Interested in sound design, procedural systems,
            and nostalgic operating-system-inspired interfaces.
        </p>

    `, 300, 220);

}

/* ARTIST STATEMENT IMAGE */

function openArtistWindow(){

    createWindow("ArtistStatement.png", `

        <img 
            src="artiststatement.png"
            class="image-frame"
        >

        <a 
            href="artiststatement.png"
            download
            class="download-btn"
        >
            Download Artist Statement
        </a>

    `, 400, 650);

}

/* IMAGE WINDOW */

function openImageWindow(imageSrc, title){

    createWindow(title, `

        <img 
            src="${imageSrc}"
            class="image-frame"
        >

        <a 
            href="${imageSrc}"
            download
            class="download-btn"
        >
            Download Image
        </a>

    `, 150, 500);

}

/* DRAGGING */

function makeDraggable(win){

    const titleBar = win.querySelector(".title-bar");

    let offsetX = 0;
    let offsetY = 0;

    let isDragging = false;

    titleBar.addEventListener("mousedown", (e) => {

        if(e.target.classList.contains("close-btn")) return;

        isDragging = true;

        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;

        win.style.zIndex = Date.now();

    });

    document.addEventListener("mousemove", (e) => {

        if(!isDragging) return;

        win.style.left = `${e.clientX - offsetX}px`;
        win.style.top = `${e.clientY - offsetY}px`;

    });

    document.addEventListener("mouseup", () => {

        isDragging = false;

    });

}

/* LIVE CLOCK */

function updateClock(){

    const clock = document.getElementById("clock");

    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();

    let ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;

    if(hours === 0){
        hours = 12;
    }

    if(minutes < 10){
        minutes = "0" + minutes;
    }

    clock.textContent = `${hours}:${minutes} ${ampm}`;

}

updateClock();

setInterval(updateClock, 1000);

/* OPEN DEFAULT WINDOWS */

openCVWindow();
openSkillsWindow();
openBioWindow();
openArtistWindow();

</script>

</body>
</html>
