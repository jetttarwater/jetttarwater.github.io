<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jett Tarwater Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, sans-serif;
}

body{
    overflow:hidden;
    background:#008080;
    height:100vh;
}

/* DESKTOP */

.desktop{
    width:100%;
    height:100vh;
    position:relative;

    background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

    background-size:4px 4px;
}

/* WINDOWS */

.window{
    position:absolute;
    width:320px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    box-shadow:4px 4px 0 rgba(0,0,0,0.3);

    z-index:1;
}

.title-bar{
    background:linear-gradient(to right, navy, #1084d0);

    color:white;

    padding:5px 8px;

    font-weight:bold;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:move;
    user-select:none;
}

.close-btn{
    width:18px;
    height:18px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    color:black;
    font-size:12px;
}

.window-content{
    padding:14px;
}

.image-frame{
    width:100%;
    display:block;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
}

/* AUDIO */

.audio-player{
    width:100%;
    margin-top:10px;
}

.audio-description{
    margin-bottom:10px;
    line-height:1.5;
}

/* YOUTUBE */

.youtube-frame{
    width:100%;
    height:220px;

    border:none;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
}

/* IMAGE DESCRIPTION */

.image-container{
    position:relative;
}

.image-description{
    position:absolute;

    top:10px;
    left:10px;
    right:10px;

    background:rgba(0,0,0,0.85);
    color:white;

    padding:10px;

    display:none;

    z-index:10;
}

/* TASKBAR */

.taskbar{
    position:absolute;
    bottom:0;

    width:100%;
    height:42px;

    background:#c0c0c0;

    border-top:2px solid #fff;

    display:flex;
    align-items:center;

    padding:4px;

    z-index:999;
}

.start-btn{
    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    padding:6px 12px;

    font-weight:bold;

    cursor:pointer;
}

.taskbar-name{
    position:absolute;

    left:50%;
    transform:translateX(-50%);

    font-weight:bold;
}

.clock{
    margin-left:auto;

    background:#bdbdbd;

    padding:5px 10px;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;

    min-width:90px;
    text-align:center;
}

/* START MENU */

.start-menu{
    position:absolute;

    bottom:45px;
    left:4px;

    width:250px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    display:none;

    max-height:500px;
    overflow:auto;

    z-index:99999;
}

.menu-item{
    padding:10px;

    border-bottom:1px solid #888;

    display:flex;
    align-items:center;
    gap:10px;

    cursor:pointer;
}

.menu-item:hover{
    background:navy;
    color:white;
}

.menu-icon{
    width:24px;
    height:24px;

    object-fit:cover;

    border:1px solid black;

    background:white;
}

</style>
</head>

<body>

<div class="desktop" id="desktop">

    <!-- START MENU -->

    <div class="start-menu" id="startMenu">

        <div class="menu-item" onclick="openCVWindow()">
            <div class="menu-icon"></div>
            <span>CV.txt</span>
        </div>

        <div class="menu-item" onclick="openSkillsWindow()">
            <div class="menu-icon"></div>
            <span>Skills.exe</span>
        </div>

        <div class="menu-item" onclick="openBioWindow()">
            <div class="menu-icon"></div>
            <span>Bio.doc</span>
        </div>

        <!-- AUDIO -->

        <div class="menu-item" onclick="openAudioWindow('track1.mp3','Track 1.wav','Experimental ambient composition.')">
            <div class="menu-icon"></div>
            <span>Track 1.wav</span>
        </div>

        <div class="menu-item" onclick="openAudioWindow('track2.mp3','Track 2.wav','Field recordings and processed textures.')">
            <div class="menu-icon"></div>
            <span>Track 2.wav</span>
        </div>

        <div class="menu-item" onclick="openAudioWindow('track3.mp3','Track 3.wav','Noise composition with granular synthesis.')">
            <div class="menu-icon"></div>
            <span>Track 3.wav</span>
        </div>

        <!-- YOUTUBE -->

        <div class="menu-item" onclick="openYoutubeWindow(
            'https://www.youtube.com/embed/dQw4w9WgXcQ',
            'Video 1',
            'Video documentation.'
        )">
            <div class="menu-icon"></div>
            <span>Video 1.url</span>
        </div>

        <div class="menu-item" onclick="openYoutubeWindow(
            'https://www.youtube.com/embed/ScMzIvxBSi4',
            'Video 2',
            'Performance recording.'
        )">
            <div class="menu-icon"></div>
            <span>Video 2.url</span>
        </div>

        <div class="menu-item" onclick="openYoutubeWindow(
            'https://www.youtube.com/embed/ysz5S6PUM-U',
            'Video 3',
            'Installation walkthrough.'
        )">
            <div class="menu-icon"></div>
            <span>Video 3.url</span>
        </div>

        <!-- ARTWORKS -->

        <script>

        const artworks = [

            {
                image:"images/art1.jpg",
                title:"Infinite Dopamine Machine",
                description:"Mixed media installation."
            },

            {
                image:"images/art2.jpg",
                title:"Signal Decay",
                description:"Analog scan textures."
            },

            {
                image:"images/art3.jpg",
                title:"Field Collapse",
                description:"Photography distortion study."
            },

            {
                image:"images/art4.jpg",
                title:"Synthetic Memory",
                description:"Digital collage experiment."
            }

        ];

        artworks.forEach((artwork) => {

            document.write(`

                <div class="menu-item"
                    onclick="openImageWindow(
                        '${artwork.image}',
                        '${artwork.title}',
                        '${artwork.description}'
                    )">

                    <img src="${artwork.image}" class="menu-icon">

                    <span>${artwork.title}</span>

                </div>

            `);

        });

        </script>

    </div>

    <!-- TASKBAR -->

    <div class="taskbar">

        <button class="start-btn" id="startButton">
            Menu
        </button>

        <div class="taskbar-name">
            Jett Tarwater
        </div>

        <div class="clock" id="clock">
            12:00 PM
        </div>

    </div>

</div>

<script>

const desktop = document.getElementById("desktop");
const startButton = document.getElementById("startButton");
const startMenu = document.getElementById("startMenu");

/* WINDOW STORAGE */

const windows = {};

/* ARTWORK DATA */

const artworks = [

    {
        id:"art1",
        image:"images/art1.jpg",
        title:"Infinite Dopamine Machine",
        description:"Mixed media installation."
    },

    {
        id:"art2",
        image:"images/art2.jpg",
        title:"Signal Decay",
        description:"Analog scan textures."
    },

    {
        id:"art3",
        image:"images/art3.jpg",
        title:"Field Collapse",
        description:"Photography distortion study."
    },

    {
        id:"art4",
        image:"images/art4.jpg",
        title:"Synthetic Memory",
        description:"Digital collage experiment."
    }

];

/* MENU */

startButton.addEventListener("click", () => {

    if(startMenu.style.display === "block"){

        startMenu.style.display = "none";

    }else{

        startMenu.style.display = "block";

    }

});

/* FOCUS WINDOW */

function focusWindow(win){

    win.style.display = "block";
    win.style.zIndex = Date.now();

}

/* CREATE WINDOW */

function createWindow(id, title, content, top=100, left=100){

    /* REOPEN EXISTING */

    if(windows[id]){

        focusWindow(windows[id]);

        return windows[id];

    }

    const windowDiv = document.createElement("div");

    windowDiv.className = "window";

    windowDiv.style.top = top + "px";
    windowDiv.style.left = left + "px";

    windowDiv.style.zIndex = Date.now();

    windowDiv.innerHTML = 

        <div class="title-bar">

            <span>${title}</span>

            <div class="close-btn">✕</div>

        </div>

        <div class="window-content">

            ${content}

        </div>

    ;

    desktop.appendChild(windowDiv);

    makeDraggable(windowDiv);

    windows[id] = windowDiv;

    const closeBtn = windowDiv.querySelector(".close-btn");

    closeBtn.addEventListener("click", () => {

        windowDiv.style.display = "none";

    });

    return windowDiv;

}

/* CV */

function openCVWindow(){

    createWindow(
        "cv",
        "CV.txt",

        
        <h2>Curriculum Vitae</h2>

        <br>

        <p><strong>Name:</strong> Jett Tarwater</p>

        <p><strong>Email:</strong> you@email.com</p>
        ,

        60,
        60
    );

}

/* SKILLS */

function openSkillsWindow(){

    createWindow(
        "skills",
        "Skills.exe",

        
        <h2>Skills</h2>

        <br>

        <ul>
            <li>HTML / CSS</li>
            <li>JavaScript</li>
            <li>Godot Engine</li>
            <li>Music Production</li>
        </ul>
        ,

        100,
        420
    );

}

/* BIO */

function openBioWindow(){

    createWindow(
        "bio",
        "Bio.doc",

        
        <h2>Bio</h2>

        <br>

        <p>
            Creative developer focused on interactive media.
        </p>
        ,

        280,
        180
    );

}

/* AUDIO */

function openAudioWindow(id, audioSrc, title, description){

    createWindow(
        id,
        title,

        
        <div class="audio-description">
            ${description}
        </div>

        <audio controls class="audio-player">

            <source src="${audioSrc}" type="audio/mpeg">

        </audio>
        ,

        Math.random() * 300 + 50,
        Math.random() * 700 + 50
    );

}

/* YOUTUBE */

function openYoutubeWindow(id, videoSrc, title, description){

    createWindow(
        id,
        title,

        
        <p style="margin-bottom:12px;">
            ${description}
        </p>

        <iframe
            class="youtube-frame"
            src="${videoSrc}"
            allowfullscreen
        ></iframe>
        ,

        Math.random() * 250 + 80,
        Math.random() * 650 + 50
    );

}

/* IMAGE WINDOW */

function openImageWindow(id, imageSrc, title, description){

    const win = createWindow(
        id,
        title,

        
        <div class="image-container">

            <div class="image-description">
                ${description}
            </div>

            <img
                src="${imageSrc}"
                class="image-frame clickable-image"
            >

        </div>
        ,

        Math.random() * 400 + 20,
        Math.random() * 700 + 20
    );

    const image = win.querySelector(".clickable-image");
    const descriptionBox = win.querySelector(".image-description");

    if(image.dataset.listenerAdded) return;

    image.dataset.listenerAdded = true;

    image.addEventListener("click", (e) => {

        e.stopPropagation();

        if(descriptionBox.style.display === "block"){

            descriptionBox.style.display = "none";

        }else{

            descriptionBox.style.display = "block";

        }

    });

}

/* DRAGGING */

function makeDraggable(win){

    const titleBar = win.querySelector(".title-bar");

    let offsetX = 0;
    let offsetY = 0;

    let isDragging = false;

    titleBar.addEventListener("mousedown", (e) => {

        if(e.target.classList.contains("close-btn")) return;

        isDragging = true;

        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;

        win.style.zIndex = Date.now();

    });

    document.addEventListener("mousemove", (e) => {

        if(!isDragging) return;

        win.style.left = `${e.clientX - offsetX}px`;
        win.style.top = `${e.clientY - offsetY}px`;

    });

    document.addEventListener("mouseup", () => {

        isDragging = false;

    });

}

/* CLOCK */

function updateClock(){

    const clock = document.getElementById("clock");

    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();

    let ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;

    if(hours === 0){
        hours = 12;
    }

    if(minutes < 10){
        minutes = "0" + minutes;
    }

    clock.textContent = `${hours}:${minutes} ${ampm}`;

}

updateClock();

setInterval(updateClock, 1000);

/* BUILD MENU */

function buildMenu(){

    let html =

        <div class="menu-item" onclick="openCVWindow()">
            <span>CV.txt</span>
        </div>

        <div class="menu-item" onclick="openSkillsWindow()">
            <span>Skills.exe</span>
        </div>

        <div class="menu-item" onclick="openBioWindow()">
            <span>Bio.doc</span>
        </div>

        <div class="menu-item"
            onclick="openAudioWindow(
                'track1',
                'track1.mp3',
                'Track 1.wav',
                'Experimental ambient composition.'
            )">
            <span>Track 1.wav</span>
        </div>

        <div class="menu-item"
            onclick="openAudioWindow(
                'track2',
                'track2.mp3',
                'Track 2.wav',
                'Field recordings and processed textures.'
            )">
            <span>Track 2.wav</span>
        </div>

        <div class="menu-item"
            onclick="openAudioWindow(
                'track3',
                'track3.mp3',
                'Track 3.wav',
                'Noise composition with granular synthesis.'
            )">
            <span>Track 3.wav</span>
        </div>

        <div class="menu-item"
            onclick="openYoutubeWindow(
                'video1',
                'https://www.youtube.com/embed/dQw4w9WgXcQ',
                'Video 1',
                'Video documentation.'
            )">
            <span>Video 1.url</span>
        </div>

    ;

    artworks.forEach((artwork) => {

        html += 

            <div class="menu-item"
                onclick="openImageWindow(
                    '${artwork.id}',
                    '${artwork.image}',
                    '${artwork.title}',
                    '${artwork.description}'
                )">

                <span>${artwork.title}</span>

            </div>

        ;

    });

    startMenu.innerHTML = html;

}

buildMenu();

/* STARTUP WINDOWS */

openCVWindow();
openSkillsWindow();
openBioWindow();

</script>

</body>
</html>
