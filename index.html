<!DOCTYPE html>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, sans-serif;
}

body{
    overflow:hidden;
    background:#008080;
    height:100vh;
}

/* DESKTOP */

.desktop{
    width:100%;
    height:100vh;
    position:relative;

    background:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);

    background-size:4px 4px;
}

/* WINDOWS */

.window{
    position:absolute;
    width:500px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    box-shadow:4px 4px 0 rgba(0,0,0,0.3);

    z-index:1;
}

.title-bar{
    background:linear-gradient(to right, navy, #1084d0);

    color:white;

    padding:5px 8px;

    font-weight:bold;

    display:flex;
    justify-content:space-between;
    align-items:center;

    cursor:move;
    user-select:none;
}

.close-btn{
    width:18px;
    height:18px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    color:black;
    font-size:12px;
}

.window-content{
    padding:14px;
}

.image-frame{
    width:100%;
    display:block;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
}

/* AUDIO */

.audio-player{
    width:100%;
    margin-top:10px;
}

.audio-description{
    margin-bottom:10px;
    line-height:1.5;
}

/* YOUTUBE */

.youtube-frame{
    width:100%;
    height:220px;

    border:none;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;
}

/* IMAGE DESCRIPTION */

.image-container{
    position:relative;
}

.image-description{
    position:absolute;

    top:10px;
    left:10px;
    right:10px;

    background:rgba(0,0,0,0.85);
    color:white;

    padding:10px;

    display:none;

    z-index:10;
}

/* TASKBAR */

.taskbar{
    position:absolute;
    bottom:0;

    width:100%;
    height:42px;

    background:#c0c0c0;

    border-top:2px solid #fff;

    display:flex;
    align-items:center;

    padding:4px;

    z-index:999;
}


.taskbar-name{
    position:absolute;

    left:50%;
    transform:translateX(-50%);

    font-weight:bold;
}

.clock{
    margin-left:auto;

    background:#bdbdbd;

    padding:5px 10px;

    border-top:2px solid #444;
    border-left:2px solid #444;
    border-right:2px solid #fff;
    border-bottom:2px solid #fff;

    min-width:90px;
    text-align:center;
}

/* START MENU */

.start-menu{
    position:absolute;

    bottom:45px;
    left:4px;

    width:250px;

    background:#c0c0c0;

    border-top:2px solid #fff;
    border-left:2px solid #fff;
    border-right:2px solid #444;
    border-bottom:2px solid #444;

    display:none;

    max-height:500px;
    overflow:auto;

    z-index:99999;
}

.menu-item{
    padding:10px;

    border-bottom:1px solid #888;

    display:flex;
    align-items:center;
    gap:10px;

    cursor:pointer;
}

.menu-item:hover{
    background:navy;
    color:white;
}

.menu-icon{
    width:24px;
    height:24px;

    object-fit:cover;

    border:1px solid black;

    background:white;
}

</style>
</head>

<script>

const desktop = document.getElementById("desktop");
const startButton = document.getElementById("startButton");
const startMenu = document.getElementById("startMenu");


/* MENU */

startButton.addEventListener("click", () => {

    if(startMenu.style.display === "block"){

        startMenu.style.display = "none";

    }else{

        startMenu.style.display = "block";

    }

});

/* WINDOW CREATOR */

function createWindow(title, content, top=100, left=100, z=1){

    const windowDiv = document.createElement("div");

    windowDiv.className = "window";

    windowDiv.style.top = top + "px";
    windowDiv.style.left = left + "px";

    windowDiv.style.zIndex = z;

    windowDiv.innerHTML = `

        <div class="title-bar">

            <span>${title}</span>

            <div class="close-btn">✕</div>

        </div>

        <div class="window-content">

            ${content}

        </div>

    `;

    desktop.appendChild(windowDiv);

    makeDraggable(windowDiv);

    const closeBtn = windowDiv.querySelector(".close-btn");

    closeBtn.addEventListener("click", () => {

        windowDiv.remove();

    });

    startMenu.style.display = "none";

    return windowDiv;

}



/* CV */

function openCVWindow(){

    createWindow("CV.txt", `

        <h2>Curriculum Vitae</h2>

        <br>

        <p><strong>Name:</strong> Jett Tarwater</p>

        <p><strong>Email:</strong> you@email.com</p>

    `, 60, 60, 100);

}

/* SKILLS */

function openSkillsWindow(){

    createWindow("Skills.exe", `

        <h2>Skills</h2>

        <br>

        <ul>
            <li>HTML / CSS</li>
            <li>JavaScript</li>
            <li>Godot Engine</li>
            <li>Music Production</li>
        </ul>

    `, 60, 360, 100);

}

/* BIO */

function openBioWindow(){

    createWindow("Bio.doc", `

        <h2>Bio</h2>

        <br>

        <p>
            When I was no more than 2-3 months old, my two-year-old sister, Merry Elliot, M.E., drowned in my grandmother's home pool. My parents were simply in another room for no longer than ten minutes. Her and I were in the playroom. Our older sister was not home. M.E. opened the back door and jumped into the pool without floaties for the first time.
        </p>

        <br>

        <p>
            I was a particularly happy baby. I'm told that I almost never cried. I'm told without the brightness that I created with my thoughtless, infant smiles and laughter; the rest of my family would have drowned in the heavy, dark, shadow of grief that seeped and festered into my family's life, home, and hearts. Ever since I was 4, the age my second, older sister, who was when M.E. died, I've lived with these stories of intense emotion and powerful truths that I was a part of but can only imagine. Yet I grieve and cry. I'm crying right now, over a girl who held and loved me, but that I cannot remember.
        </p>

        <br>

        <p>
            If my parents never told me her stories, I wouldn't feel such emotion. But if can never know her love, then the sadness of her loss will have to do. And if stories are so powerful that they can hold, preserve, and pass on something as special as the love I feel from her now, there must be no limit to what they can do.
        </p>

        <br>

        <p>
            I try to give people a chance to love, or mourn, or admire, or hate, or just to feel something from the worlds I create. Or from the people that they will never get a chance to truly know. And there is no good or bad feeling. Because feeling something is always better than feeling nothing.
        </p>

    `, 60, 660, 100);

}
/* PINNED IMAGE */

function openPinnedImageWindow(){

    const win = createWindow("Artist Statement.doc", `

        <div class="image-container">

            <div class="image-description">

            </div>

}
    // top, left, z-index — adjust as you like
/* AUDIO WINDOWS */

function openAudioWindow(audioSrc, title, description){

    createWindow(title, `

        <div class="audio-description">
            ${description}
        </div>

        <audio class="audio-player" controls>
            <source src="${audioSrc}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

    `,
Math.random() * (window.innerHeight - 250) + 20,   // top
Math.random() * (window.innerWidth - 350) + 20,    // left
    0
    );

}


/* IMAGE WINDOWS */

function openImageWindow(imageSrc, title, description){

    const win = createWindow(title, `

        <div class="image-container">

            <div class="image-description">
                ${description}
            </div>

            <img 
                src="${imageSrc}"
                class="image-frame clickable-image"
            >

        </div>

    `,
    Math.random() * (window.innerHeight - 250) + 20,   // top
Math.random() * (window.innerWidth - 350) + 20,    // left
    0
    );

    const image = win.querySelector(".clickable-image");
    const descriptionBox = win.querySelector(".image-description");

    image.addEventListener("click", (e) => {

        e.stopPropagation();

        if(descriptionBox.style.display === "block"){

            descriptionBox.style.display = "none";

        }else{

            descriptionBox.style.display = "block";

        }

    });

}

/* DRAGGING */

function makeDraggable(win){

    const titleBar = win.querySelector(".title-bar");

    let offsetX = 0;
    let offsetY = 0;

    let isDragging = false;

    titleBar.addEventListener("mousedown", (e) => {

        if(e.target.classList.contains("close-btn")) return;

        isDragging = true;

        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;

        win.style.zIndex = Date.now();

    });

    document.addEventListener("mousemove", (e) => {

        if(!isDragging) return;

        win.style.left = `${e.clientX - offsetX}px`;
        win.style.top = `${e.clientY - offsetY}px`;

    });

    document.addEventListener("mouseup", () => {

        isDragging = false;

    });

}

/* CLOCK */

function updateClock(){

    const clock = document.getElementById("clock");

    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();

    let ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;

    if(hours === 0){
        hours = 12;
    }

    if(minutes < 10){
        minutes = "0" + minutes;
    }

    clock.textContent = `${hours}:${minutes} ${ampm}`;

}

updateClock();

setInterval(updateClock, 1000);
